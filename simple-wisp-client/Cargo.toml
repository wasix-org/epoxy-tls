[package]
name = "simple-wisp-client"
version = "1.0.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
atomic-counter = "1.0.1"
bytes = "1.7.1"
clap = { version = "4.5.16", features = ["cargo", "derive"] }
console-subscriber = { version = "0.4.0", optional = true }
ed25519-dalek = { version = "2.1.1", features = ["pem"] }
futures = "0.3.30"
humantime = "2.1.0"
hyper = { version = "1.4.1", features = ["http1", "client"] }
sha2 = "0.10.8"
simple_moving_average = "1.0.2"
tikv-jemallocator = "0.6.0"
tokio = { version = "1.43.0", features = ["full"] }
tokio-websockets = { version = "0.12.0", features = ["client", "sha1_smol", "rand", "native-tls"] }
wisp-mux = { path = "../wisp", features = ["tokio-websockets"]}

[features]
tokio-console = ["tokio/tracing", "dep:console-subscriber"]
