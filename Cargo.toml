[workspace]
resolver = "2"
members = ["server", "wisp", "simple-wisp-client"]
# client is its own workspace (client/Cargo.toml) so its h2/hyper wasm fork
# patches stay scoped to the wasm build and never reach the native server.
exclude = ["client"]

[profile.release]
lto = true
debug = true
strip = false
panic = "abort"
codegen-units = 1
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
missing_fields_in_debug = "allow"
case_sensitive_file_extension_comparisons = "allow"
